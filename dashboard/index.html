<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wayline</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>wayline</h1>
  <nav id="tabs" aria-label="projects"></nav>
  <p id="transport" class="note"></p>
  <p><button type="button" id="tick-log-button">tick log</button></p>
</header>

<main>
  <section id="overview" aria-labelledby="overview-heading">
    <h2 id="overview-heading">Overview</h2>
    <div id="overview-body" class="panel">loading...</div>
  </section>

  <section id="graph" aria-labelledby="graph-heading">
    <h2 id="graph-heading">Graph</h2>
    <div id="graph-body" class="panel graph">loading...</div>
  </section>

  <section id="ticket" aria-labelledby="ticket-heading" hidden>
    <h2 id="ticket-heading">Ticket</h2>
    <p><button type="button" id="ticket-back">&larr; back to the graph</button></p>
    <div id="ticket-body" class="panel"></div>
  </section>

  <section id="logs" aria-labelledby="logs-heading" hidden>
    <h2 id="logs-heading">Log</h2>
    <p><button type="button" id="logs-back">&larr; back</button> <span id="logs-note" class="note"></span></p>
    <pre id="logs-tail" class="tail log-tail"></pre>
  </section>

  <section id="outputs" aria-labelledby="outputs-heading">
    <h2 id="outputs-heading">Outputs</h2>
    <div id="outputs-body" class="panel">loading...</div>
  </section>

  <section id="journal" aria-labelledby="journal-heading">
    <h2 id="journal-heading">Journal</h2>
    <p id="journal-note" class="note"></p>
    <ol id="journal-tail" class="tail" reversed></ol>
  </section>
</main>

<footer>
  <p class="note">Read-only in M1.</p>
</footer>

<!-- Pinned, checked in, and served as static assets; never imported by the harness. See vendor/VENDOR.md. -->
<script src="/vendor/marked.umd.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
